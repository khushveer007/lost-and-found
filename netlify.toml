[build]
  command = "npm run netlify-build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ./package.json"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"
  NETLIFY_USE_YARN = "false"
  NETLIFY_USE_PNPM = "false"
  GO_IMPORT_PATH = ""
  GO_VERSION = "off"
  HUGO_VERSION = "off"
  PHP_VERSION = "off"
  RUBY_VERSION = "off"
  PYTHON_VERSION = "off"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
